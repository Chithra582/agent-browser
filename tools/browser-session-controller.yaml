name: "browser-session-controller"
description: "Launches, manages, and terminates headless or windowed Chromium browser sessions via CDP."
input_schema:
  type: object
  properties:
    action:
      type: string
      description: "Lifecycle action to perform on the browser session."
      enum: ["launch", "close", "restart", "status", "list_tabs"]
    headless:
      type: boolean
      description: "Whether to run Chromium in headless mode."
      default: true
    user_data_dir:
      type: string
      description: "Custom user profile data directory path for persistent state."
    viewport_width:
      type: integer
      description: "Initial browser viewport width in pixels."
      default: 1280
    viewport_height:
      type: integer
      description: "Initial browser viewport height in pixels."
      default: 800
  required:
    - action
